<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Poster dan Brosur Hidup</title>
  <style>
    :root {
      --glass: rgba(15, 23, 42, .74);
      --line: rgba(255, 255, 255, .16);
      --txt: #f8fafc;
      --muted: #cbd5e1;
      --ok: #22c55e;
      --warn: #f59e0b;
      --brand: #3b82f6;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000;
                 font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
                 -webkit-tap-highlight-color: transparent; }
    #ar { position: fixed; inset: 0; touch-action: none; }

    /* ===== HUD atas ===== */
    #hud { position: fixed; top: calc(10px + var(--safe-t)); left: 12px; right: 12px; z-index: 10;
           display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
           pointer-events: none; }
    .chip { background: var(--glass); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
            border: 1px solid var(--line); color: var(--txt); border-radius: 999px;
            padding: 9px 14px; font-size: 13px; font-weight: 600;
            display: flex; align-items: center; gap: 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--warn);
           animation: pulse 1.2s ease-in-out infinite; }
    .chip.found .dot { background: var(--ok); animation: none; box-shadow: 0 0 0 4px rgba(34,197,94,.25); }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .4; transform: scale(.7); } }

    /* ===== Bingkai pemindaian ===== */
    #reticle { position: fixed; left: 50%; top: 46%; width: min(72vw, 320px); aspect-ratio: 3 / 4;
               transform: translate(-50%, -50%); z-index: 5; pointer-events: none; transition: opacity .3s; }
    #reticle.hide { opacity: 0; }
    #reticle i { position: absolute; width: 36px; height: 36px; border: 4px solid #fff; opacity: .92; }
    #reticle .tl { top: 0; left: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 16px; }
    #reticle .tr { top: 0; right: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 16px; }
    #reticle .bl { bottom: 0; left: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 16px; }
    #reticle .br { bottom: 0; right: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 16px; }
    #reticle .scan { position: absolute; left: 6%; right: 6%; height: 3px; border-radius: 3px;
                     background: linear-gradient(90deg, transparent, var(--brand), transparent);
                     animation: scan 2.2s ease-in-out infinite; }
    @keyframes scan { 0%,100% { top: 6%; } 50% { top: 94%; } }
    #reticle .rhint { position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
                      margin-top: 16px; width: 120%; text-align: center; color: #fff;
                      font-size: 14px; font-weight: 600; text-shadow: 0 1px 6px rgba(0,0,0,.8); }

    /* ===== Panel info (bottom sheet) ===== */
    #sheet { position: fixed; left: 12px; right: 12px; bottom: calc(14px + var(--safe-b));
             max-width: 520px; margin: 0 auto; z-index: 10; padding: 16px; color: var(--txt);
             background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
             border: 1px solid var(--line); border-radius: 22px;
             transform: translateY(130%); opacity: 0; pointer-events: none;
             transition: transform .35s cubic-bezier(.2,.9,.3,1), opacity .25s; }
    #sheet.show { transform: none; opacity: 1; pointer-events: auto; }
    #sheet .tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .04em;
                  text-transform: uppercase; color: #bfdbfe; background: rgba(59,130,246,.25);
                  padding: 4px 10px; border-radius: 999px; }
    #sheet h2 { margin: 10px 0 6px; font-size: 20px; line-height: 1.25; }
    #sheet p { margin: 0 0 12px; font-size: 14px; line-height: 1.5; color: var(--muted); }
    #sheet .hints { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    #sheet .hints span { font-size: 13px; color: var(--txt); background: rgba(255,255,255,.1);
                         padding: 7px 12px; border-radius: 999px; }
    #sheet .actions { display: flex; gap: 10px; }
    #sheet .actions > * { flex: 1; min-height: 48px; display: flex; align-items: center; justify-content: center;
                          border-radius: 14px; font-size: 15px; font-weight: 700; text-decoration: none;
                          border: 1px solid var(--line); background: rgba(255,255,255,.1); color: var(--txt);
                          cursor: pointer; font-family: inherit; }
    #sheet .actions .primary { background: var(--brand); border-color: transparent; color: #fff; }
    #sheet .actions > *:active { transform: scale(.97); }

    /* ===== Layar muat / error ===== */
    #overlay { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center;
               padding: 24px; background: radial-gradient(circle at 50% 30%, #1e3a8a 0%, #0f172a 70%); }
    #overlay.show { display: flex; }
    .ov-card { width: min(92vw, 360px); text-align: center; color: var(--txt); }
    .ov-title { font-size: 22px; font-weight: 800; margin: 18px 0 6px; }
    #ov-text { margin: 0 0 18px; font-size: 15px; line-height: 1.5; color: var(--muted); }
    .spinner { width: 46px; height: 46px; margin: 0 auto; border-radius: 50%;
               border: 5px solid rgba(255,255,255,.18); border-top-color: var(--brand);
               animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #overlay.error .spinner { display: none; }
    #ov-reload { min-height: 48px; padding: 0 22px; border: 0; border-radius: 14px; background: var(--brand);
                 color: #fff; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <div id="ar"></div>

  <div id="hud">
    <div id="pill" class="chip"><span class="dot"></span><span id="pill-text">Memuat…</span></div>
    <div id="count" class="chip">Dipindai 0/0</div>
  </div>

  <div id="reticle" class="hide">
    <i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i>
    <span class="scan"></span>
    <div class="rhint">Arahkan kamera ke gambar target</div>
  </div>

  <section id="sheet" aria-live="polite">
    <span class="tag" id="sheet-tag">Target</span>
    <h2 id="sheet-judul"></h2>
    <p id="sheet-isi"></p>
    <div class="hints"><span>👆 Ketuk objek</span><span>🤏 Cubit untuk zoom</span></div>
    <div class="actions">
      <button id="btn-reset" type="button">Reset ukuran</button>
      <a id="btn-link" class="primary" target="_blank" rel="noopener" hidden>Buka tautan</a>
    </div>
  </section>

  <div id="overlay" class="show">
    <div class="ov-card">
      <div class="spinner"></div>
      <div class="ov-title">Poster dan Brosur Hidup</div>
      <p id="ov-text">Memuat…</p>
      <button id="ov-reload" type="button">Muat ulang</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { MindARThree } from 'mindar-image-three';

    const $ = (id) => document.getElementById(id);
    const ui = {
      overlay: $('overlay'), ovText: $('ov-text'), reload: $('ov-reload'),
      pill: $('pill'), pillText: $('pill-text'), count: $('count'),
      reticle: $('reticle'), sheet: $('sheet'),
      tag: $('sheet-tag'), judul: $('sheet-judul'), isi: $('sheet-isi'),
      link: $('btn-link'), reset: $('btn-reset')
    };
    ui.reload.addEventListener('click', () => location.reload());

    // ===== Penyimpanan lokal: daftar target yang sudah dipindai =====
    const KEY = 'posterhidup:dipindai';
    function loadSeen() {
      try { return new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); }
      catch (e) { return new Set(); }
    }
    function saveSeen(set) {
      try { localStorage.setItem(KEY, JSON.stringify([...set])); } catch (e) { /* abaikan */ }
    }

    // ===== Helper tampilan =====
    function setLoading(text) {
      ui.overlay.className = 'show';
      ui.ovText.textContent = text;
      ui.reload.hidden = true;
    }
    function hideLoading() { ui.overlay.className = ''; }
    function showError(text) {
      ui.overlay.className = 'show error';
      ui.ovText.textContent = text;
      ui.reload.hidden = false;
    }
    function setSearching() {
      ui.pill.className = 'chip search';
      ui.pillText.textContent = 'Mencari target…';
      ui.reticle.classList.remove('hide');
      ui.sheet.classList.remove('show');
    }
    function setFound(t, i, n) {
      ui.pill.className = 'chip found';
      ui.pillText.textContent = 'Target ditemukan';
      ui.reticle.classList.add('hide');
      ui.tag.textContent = 'Target ' + (i + 1) + ' dari ' + n;
      ui.judul.textContent = t.judul;
      ui.isi.textContent = t.deskripsi;
      if (t.tautan) { ui.link.href = t.tautan; ui.link.hidden = false; }
      else { ui.link.hidden = true; }
      ui.sheet.classList.add('show');
    }

    // ===== Validasi isi JSON =====
    function validasi(data) {
      if (!data || !Array.isArray(data.targets) || data.targets.length === 0)
        throw new Error('targets.json kosong atau formatnya salah');
      for (const t of data.targets) {
        for (const k of ['index', 'judul', 'deskripsi', 'model'])
          if (t[k] === undefined) throw new Error('Field "' + k + '" hilang pada salah satu target');
      }
    }

    const cariKlip = (clips, nama) => clips.find((c) => c.name === nama) || null;

    async function main() {
      // 1) Muat data
      setLoading('Memuat data…');
      let data;
      try {
        const res = await fetch('data/targets.json');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        data = await res.json();
        validasi(data);
      } catch (e) {
        showError('Gagal memuat data: ' + e.message);
        return;
      }
      const total = data.targets.length;
      const seen = loadSeen();
      const updateCount = () => { ui.count.textContent = 'Dipindai ' + seen.size + '/' + total; };
      updateCount();

      // 2) Siapkan MindAR (UI bawaan dimatikan, kita pakai HUD sendiri)
      const mindar = new MindARThree({
        container: $('ar'),
        imageTargetSrc: 'assets/targets/targets.mind',
        uiLoading: 'no', uiScanning: 'no', uiError: 'no'
      });
      const { renderer, scene, camera } = mindar;
      scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 2.5));

      const loader = new GLTFLoader();
      const entries = [];
      let active = null;

      // 3) Anchor + model untuk tiap target
      for (const [i, t] of data.targets.entries()) {
        setLoading('Memuat model 3D ' + (i + 1) + ' dari ' + total + '…');
        const anchor = mindar.addAnchor(t.index);
        let gltf;
        try {
          gltf = await loader.loadAsync(t.model);
        } catch (e) {
          showError('Model gagal dimuat: ' + t.model);
          return;
        }

        const holder = new THREE.Group();
        const model = gltf.scene;
        model.scale.setScalar(t.skala ?? 0.2);
        model.position.set(...(t.posisi ?? [0, 0, 0.1]));
        model.rotation.set(...(t.rotasi ?? [0, 0, 0]));
        holder.add(model);
        anchor.group.add(holder);

        const mixer = new THREE.AnimationMixer(model);
        const idleClip = cariKlip(gltf.animations, t.klipIdle) || gltf.animations[0] || null;
        const aksiClip = cariKlip(gltf.animations, t.klipAksi);
        const en = {
          t, holder, model, mixer,
          idle: idleClip ? mixer.clipAction(idleClip) : null,
          aksi: aksiClip ? mixer.clipAction(aksiClip) : null,
          busy: false, spinLeft: 0
        };
        en.idle?.play();

        anchor.onTargetFound = () => {
          active = en;
          seen.add(String(t.id ?? t.index));
          saveSeen(seen);
          updateCount();
          if (navigator.vibrate) navigator.vibrate(25);
          setFound(t, i, total);
        };
        anchor.onTargetLost = () => {
          if (active === en) active = null;
          setSearching();
        };
        entries.push(en);
      }

      // 4) Jalankan kamera (tangani izin ditolak)
      setLoading('Menyalakan kamera… izinkan akses kamera jika diminta.');
      try {
        await mindar.start();
      } catch (e) {
        const denied = e && (e.name === 'NotAllowedError' || /permission|denied/i.test(String(e)));
        showError(
          denied
            ? 'Izin kamera ditolak. Aktifkan izin kamera di pengaturan browser, lalu muat ulang halaman.'
            : 'Kamera gagal dimulai: ' + (e.message || e)
        );
        return;
      }
      hideLoading();
      setSearching();

      // 5) Interaksi: ketuk = animasi aksi, cubit = zoom
      const dom = renderer.domElement;
      document.documentElement.style.touchAction = 'none';
      document.body.style.touchAction = 'none';

      const raycaster = new THREE.Raycaster();
      const ndc = new THREE.Vector2();
      const box = new THREE.Box3();
      const pointers = new Map();
      let tapStart = null, pinchStart = 0, scaleStart = 1;

      // Mode diagnosis: tambahkan ?debug di alamat web
      const debugOn = new URLSearchParams(location.search).has('debug');
      const dbg = document.createElement('div');
      let lastEvt = '-';
      if (debugOn) {
        dbg.style.cssText = 'position:fixed;top:96px;left:8px;z-index:20;background:rgba(0,0,0,.7);color:#0f0;font:12px monospace;padding:6px 8px;border-radius:6px;pointer-events:none;white-space:pre';
        document.body.appendChild(dbg);
      }
      const info = () => {
        if (!debugOn) return;
        dbg.textContent =
          'target aktif: ' + (active ? (active.t.id || active.t.index) : 'tidak') +
          '\njari: ' + pointers.size +
          '\nterakhir: ' + lastEvt +
          '\nklip aksi: ' + (active ? (active.aksi ? 'ada' : 'TIDAK ADA') : '-') +
          '\nzoom: ' + (active ? active.holder.scale.x.toFixed(2) : '-');
      };

      const jarak = () => {
        const [a, b] = [...pointers.values()];
        return Math.hypot(a.x - b.x, a.y - b.y);
      };

      function mainkanAksi(en) {
        if (en.busy) return;
        en.busy = true;
        if (en.aksi) {
          en.idle?.fadeOut(0.2);
          en.aksi.reset().setLoop(THREE.LoopOnce, 1);
          en.aksi.clampWhenFinished = true;
          en.aksi.fadeIn(0.2).play();
          const selesai = (ev) => {
            if (ev.action !== en.aksi) return;
            en.mixer.removeEventListener('finished', selesai);
            en.aksi.fadeOut(0.2);
            en.idle?.reset().fadeIn(0.2).play();
            en.busy = false;
          };
          en.mixer.addEventListener('finished', selesai);
        } else {
          en.spinLeft = Math.PI * 2;
        }
      }

      function handleTap(e) {
        if (!active) { lastEvt = 'ketuk: tidak ada target aktif'; return; }
        const r = dom.getBoundingClientRect();
        ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
        ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
        raycaster.setFromCamera(ndc, camera);
        active.holder.updateWorldMatrix(true, true);
        let kena = raycaster.intersectObject(active.holder, true).length > 0;
        if (!kena) {
          box.setFromObject(active.holder).expandByScalar(0.15);
          kena = raycaster.ray.intersectsBox(box);
        }
        lastEvt = kena ? 'ketuk: KENA objek' : 'ketuk: meleset';
        if (kena) mainkanAksi(active);
      }

      const abaikan = (e) => e.target && e.target.closest && e.target.closest('#sheet, #overlay');

      window.addEventListener('pointerdown', (e) => {
        if (abaikan(e)) return;
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pointers.size === 1) {
          tapStart = { x: e.clientX, y: e.clientY, t: performance.now() };
          lastEvt = 'sentuh 1 jari';
        } else {
          tapStart = null;
          if (pointers.size === 2 && active) {
            pinchStart = jarak();
            scaleStart = active.holder.scale.x;
            lastEvt = 'mulai cubit';
          }
        }
      });

      window.addEventListener('pointermove', (e) => {
        if (!pointers.has(e.pointerId)) return;
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pointers.size === 2 && active && pinchStart > 0) {
          const s = THREE.MathUtils.clamp(scaleStart * (jarak() / pinchStart), 0.5, 3);
          active.holder.scale.setScalar(s);
          lastEvt = 'cubit: ' + s.toFixed(2);
        }
      });

      const akhir = (e) => {
        if (!pointers.has(e.pointerId)) return;
        if (e.type === 'pointerup' && pointers.size === 1 && tapStart) {
          const geser = Math.hypot(e.clientX - tapStart.x, e.clientY - tapStart.y);
          if (geser < 15 && performance.now() - tapStart.t < 500) handleTap(e);
        }
        pointers.delete(e.pointerId);
        if (pointers.size < 2) pinchStart = 0;
      };
      window.addEventListener('pointerup', akhir);
      window.addEventListener('pointercancel', akhir);

      // Zoom dengan scroll mouse / cubit touchpad (untuk uji di laptop)
      window.addEventListener('wheel', (e) => {
        if (!active) return;
        e.preventDefault();
        const k = e.ctrlKey ? 0.01 : 0.002;
        const s = THREE.MathUtils.clamp(active.holder.scale.x * Math.exp(-e.deltaY * k), 0.5, 3);
        active.holder.scale.setScalar(s);
      }, { passive: false });

      // Tombol reset ukuran
      ui.reset.addEventListener('click', () => {
        if (active) active.holder.scale.setScalar(1);
      });

      // 6) Render loop
      const clock = new THREE.Clock();
      renderer.setAnimationLoop(() => {
        const dt = clock.getDelta();
        for (const en of entries) {
          en.mixer.update(dt);
          if (en.spinLeft > 0) {
            const step = Math.min(en.spinLeft, dt * 6);
            en.model.rotation.y += step;
            en.spinLeft -= step;
            if (en.spinLeft <= 0) en.busy = false;
          }
        }
        info();
        renderer.render(scene, camera);
      });
    }

    main();
  </script>
</body>
</html>
